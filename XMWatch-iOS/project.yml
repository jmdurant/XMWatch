name: XMWatch-iOS
options:
  bundleIdPrefix: com.doctordurant.xmwatch
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  xcodeVersion: "27.0"

settings:
  base:
    DEVELOPMENT_TEAM: ADVQS8RXPZ
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: false
    CODE_SIGN_STYLE: Automatic

packages:
  StarPlayrRadioKit:
    path: ../StarPlayrRadioKit
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    exactVersion: 1.0.1

targets:
  XMWatch-iOS:
    type: application
    platform: iOS
    productName: XMWatch
    sources:
      - path: XMWatchApp.swift
      - path: Features
      - path: Models
      - path: Player
      - path: Services
      - path: MetaGlasses
      - path: Assets.xcassets
      - path: ../Shared/Intents
      - path: ../Shared/Connectivity
    dependencies:
      - package: StarPlayrRadioKit
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATDisplay
      - target: XMWatch-watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch
        PRODUCT_NAME: XMWatch
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: XMWatch-iOS.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "12"
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

  XMWatchMetaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../Tests/MetaGlasses
    dependencies:
      - target: XMWatch-iOS
      - package: MetaWearablesDAT
        product: MWDATMockDevice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch.meta-tests
        GENERATE_INFOPLIST_FILE: YES

  XMWatch-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: ../XMWatch-watchOS/XMWatchApp.swift
      - path: ../XMWatch-watchOS/Features
      - path: ../XMWatch-watchOS/Models
      - path: ../XMWatch-watchOS/Player
      - path: ../XMWatch-watchOS/Services
      - path: ../XMWatch-watchOS/Assets.xcassets
      - path: ../Shared/Intents
      - path: ../Shared/Connectivity
    dependencies:
      - package: StarPlayrRadioKit
      - target: XMWatchWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch.watchos
        INFOPLIST_FILE: ../XMWatch-watchOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../XMWatch-watchOS/XMWatch-watchOS.entitlements
        PRODUCT_NAME: XMWatch-watchOS
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "12"
        SKIP_INSTALL: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

  XMWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "27.0"
    sources:
      - path: ../XMWatch-watchOS/XMWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch.watchos.widget
        INFOPLIST_FILE: ../XMWatch-watchOS/XMWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ../XMWatch-watchOS/XMWatchWidget/XMWatchWidget.entitlements
        PRODUCT_NAME: XMWatchWidgetExtension
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "12"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  XMWatch-iOS:
    build:
      targets:
        XMWatch-iOS: all
    test:
      targets:
        - name: XMWatchMetaTests
          parallelizable: false
      environmentVariables:
        XM_SKIP_STARTUP_FOR_TESTS: "1"
