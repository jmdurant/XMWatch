name: XMWatch-watchOS
options:
  bundleIdPrefix: com.starplayrx
  deploymentTarget:
    watchOS: "26.0"
  xcodeVersion: "26.2"

packages:
  StarPlayrRadioKit:
    path: ../StarPlayrRadioKit

configs:
  Debug: debug
  Release: release

targets:
  XMWatch-watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: XMWatchApp.swift
      - path: Features
      - path: Models
      - path: Player
      - path: Services
      - path: Assets.xcassets
    dependencies:
      - package: StarPlayrRadioKit
      - target: XMWatchWidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch.watchos
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: XMWatch-watchOS.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PHS5V2FW3J
        PRODUCT_NAME: XMWatch-watchOS
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule

  XMWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: XMWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doctordurant.xmwatch.watchos.widget
        INFOPLIST_FILE: XMWatchWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: XMWatchWidget/XMWatchWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PHS5V2FW3J
        PRODUCT_NAME: XMWatchWidgetExtension
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule
